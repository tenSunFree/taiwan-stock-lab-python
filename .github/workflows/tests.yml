name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The K-line chart tests draw real Traditional-Chinese text; the
      # runner has no CJK font by default. test_ci_has_cjk_font fails loudly
      # if this step is ever removed (instead of ~25 rendering tests
      # silently skipping).
      - name: Install CJK font (chart rendering tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh-tw family | sort -u | head -5

      - name: Run tests
        run: pytest -v