name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The chart renderer needs a CJK font. Without it the rendering tests
      # would have nothing to draw with, so install it explicitly and fail
      # this step (not silently skip tests) if it is not visible afterwards.
      - name: Install CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-list | grep -qi "Noto Sans CJK"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v