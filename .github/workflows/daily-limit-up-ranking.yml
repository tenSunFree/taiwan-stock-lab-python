name: daily-limit-up-ranking

on:
  schedule:
    # Taiwan time 18:00 / 18:30 / ... / 23:30, Monday-Friday.
    #
    # Deliberately stops at 23:30 so every attempt belongs to the same
    # Taiwan calendar day. GitHub can DELAY scheduled triggers, so the
    # `gate` job does not trust the wall clock: it derives the intended
    # trading date from this run's own created_at timestamp, skips any
    # trigger created outside the 18:00-23:59 Taipei window (e.g. a 23:30
    # trigger delayed past midnight), and passes that pinned date to the
    # `ranking` job as TARGET_TRADING_DATE — so a run that starts late
    # (scheduler delay or waiting in the concurrency queue) still
    # processes the evening it was scheduled for, never the next day.
    #
    # Each trigger first runs the `gate` job, which checks whether an
    # earlier SCHEDULED run's `ranking` job already succeeded for the
    # pinned trading date:
    #   - no prior success  -> run the real `ranking` job
    #   - already succeeded -> skip `ranking` entirely (fast no-op)
    # This is a compute-saving layer ON TOP of app.delivery.service's
    # own database idempotency (DATABASE_URL), never a replacement for it.
    - cron: "0,30 18-23 * * 1-5"
      timezone: "Asia/Taipei"

  workflow_dispatch:
    inputs:
      trading_date:
        description: "Target trading date (YYYY-MM-DD); leave empty to use today"
        required: false
        type: string
      dry_run:
        description: "Preview report only — forces LINE_DELIVERY_MODE=off regardless of delivery_mode below"
        required: true
        default: true
        type: boolean
      delivery_mode:
        description: "LINE delivery mode when dry_run=false (broadcast = send to every OA friend)"
        required: true
        default: "off"
        type: choice
        # "push" is deliberately NOT offered: this repo has no
        # LINE_TARGET_ID secret (broadcast-only delivery), and
        # daily_ranking.py exits 1 if LINE_DELIVERY_MODE=push is
        # selected without one.
        options:
          - "off"
          - broadcast

# Nothing granted at the workflow level; each job below requests only
# what it actually needs (least privilege).
permissions: {}

# Prevents overlapping runs. A new trigger WAITS for the running one
# instead of cancelling it, so a later scheduled attempt's `gate` job
# only ever sees fully-finished earlier runs. Keyed by trading_date so a
# manual backfill for a different date gets its own lane.
#
# `queue: max`: by default GitHub keeps only ONE pending run per group
# and cancels it when another trigger arrives. With `max`, up to 100
# pending runs wait and execute in FIFO order, so no retry is silently
# dropped; once one succeeds, the remaining queued ones exit quickly at
# `gate`. (`queue: max` cannot be combined with cancel-in-progress: true.)
#
# This only prevents concurrent execution. Duplicate-LINE-send
# protection comes from app.delivery.service's database idempotency.
concurrency:
  group: daily-limit-up-ranking-${{ github.event.inputs.trading_date || 'scheduled' }}
  cancel-in-progress: false
  queue: max

env:
  GCP_PROJECT_ID: travel-audio-guide-508205
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1088235476550/locations/global/workloadIdentityPools/github/providers/taiwan-stock-lab
  GCP_SERVICE_ACCOUNT: github-taiwan-stock-lab@travel-audio-guide-508205.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: travel-audio-guide-508205:asia-east1:travel-db
  # Pinned Cloud SQL Auth Proxy release + its officially published
  # SHA-256 (from the GitHub release notes for v2.25.4). Bump both
  # together when upgrading.
  CLOUD_SQL_PROXY_VERSION: v2.25.4
  CLOUD_SQL_PROXY_SHA256: b780c0d2c445ffd5d2fdba0925f2722c19fcd0d2c27c538e85713732698561f2

jobs:
  # --------------------------------------------------------------------
  # Job 1: decide whether tonight's ranking pipeline needs to run at all
  # --------------------------------------------------------------------
  gate:
    name: Check for an earlier successful scheduled run today
    runs-on: ubuntu-latest
    permissions:
      actions: read   # query this workflow's own past runs
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      # Pinned Taiwan trading date for scheduled runs; empty for manual
      # runs (which use their own trading_date input instead).
      trading_date: ${{ steps.check.outputs.trading_date }}
    steps:
      - name: Check today's scheduled runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "trading_date=" >> "$GITHUB_OUTPUT"

          # Production credentials are only ever handed to code on main.
          # Scheduled runs always use the default branch; this blocks a
          # manual workflow_dispatch from any other branch. (The real
          # enforcement boundary is the GCP-side WIF attribute condition
          # restricting assertion.ref to refs/heads/main, since a branch
          # could edit this file — this check prevents accidents.)
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::warning::Refusing to run on ${GITHUB_REF}; production runs are main-only."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual runs always execute (dry-run preview, backfill, or an
          # intentional extra live attempt).
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "workflow_dispatch run — always executes."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Derive the intended date from THIS run's creation time, not
          # the current clock: created_at is fixed when the scheduler
          # creates the run, so time spent waiting for a runner or in the
          # concurrency queue cannot shift it to the next day.
          CREATED_AT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')"
          INTENDED_DATE="$(TZ=Asia/Taipei date -d "${CREATED_AT}" +%F)"
          CREATED_HOUR_TW="$(TZ=Asia/Taipei date -d "${CREATED_AT}" +%H)"
          echo "Run created at ${CREATED_AT} (Taipei ${INTENDED_DATE} ${CREATED_HOUR_TW}h)"

          # Every legitimate trigger is created between 18:00 and 23:59
          # Taipei. Anything else is a delayed trigger that crossed
          # midnight — skip it rather than process a different day.
          if (( 10#${CREATED_HOUR_TW} < 18 )); then
            echo "::warning::Trigger created outside the 18:00-23:59 Taipei window (likely delayed past midnight) — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count runs whose `ranking` JOB actually succeeded — never a
          # run's overall conclusion. A run where `gate` skipped `ranking`
          # (already done, or a delayed trigger outside the window) still
          # concludes "success" because GitHub reports skipped jobs as
          # success; counting those could let a trigger delayed into the
          # next day (e.g. created at 12:00 Taipei = 04:00 UTC of the NEXT
          # UTC date) suppress that whole evening.
          #
          # Only runs whose ranking job really ran can count, and those
          # were all created 18:00-23:59 Taipei = 10:00-15:59 UTC of the
          # SAME UTC date, so filtering the API's UTC-based `created`
          # parameter by INTENDED_DATE finds exactly the right candidates.
          #
          # NOTE: must match the `ranking` job's `name:` below exactly.
          RANKING_JOB_NAME="Run daily ranking"

          CANDIDATE_RUN_IDS="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-limit-up-ranking.yml/runs?event=schedule&created=${INTENDED_DATE}&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id'
          )"

          SUCCESS_COUNT=0
          for RUN_ID in ${CANDIDATE_RUN_IDS}; do
            RANKING_OK="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                | jq --arg name "${RANKING_JOB_NAME}" \
                    '[.jobs[] | select(.name == $name and .conclusion == "success")] | length'
            )"
            if (( RANKING_OK > 0 )); then
              echo "Run ${RUN_ID}: '${RANKING_JOB_NAME}' succeeded."
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              break
            fi
          done
          echo "Scheduled runs with a successful ranking job for ${INTENDED_DATE}: ${SUCCESS_COUNT}"

          if [[ "${SUCCESS_COUNT}" -gt 0 ]]; then
            echo "Already succeeded for ${INTENDED_DATE} — skipping the ranking job."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No success yet for ${INTENDED_DATE} — running the ranking job."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "trading_date=${INTENDED_DATE}" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------
  # Job 2: Cloud SQL connectivity + ranking pipeline + LINE delivery
  #
  # Connection chain:
  #   GitHub OIDC -> Workload Identity Federation -> impersonate
  #   github-taiwan-stock-lab SA (roles/cloudsql.client) -> Cloud SQL
  #   Auth Proxy on this runner -> 127.0.0.1:5432 -> DATABASE_URL
  #
  # DATABASE_URL intentionally points at 127.0.0.1:5432 — that address
  # only becomes valid once the proxy below is listening on this runner.
  # --------------------------------------------------------------------
  ranking:
    # NOTE: `gate` matches this exact name to detect a completed ranking
    # (RANKING_JOB_NAME). Rename both together.
    name: Run daily ranking
    needs: [gate]
    # Defense in depth alongside the gate's own branch check: this job
    # holds the production credentials, so it never runs outside main.
    if: needs.gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # actions/checkout
      id-token: write  # GitHub OIDC token for Workload Identity Federation

    steps:
      # Must come BEFORE google-github-actions/auth: auth writes its
      # credentials file into $GITHUB_WORKSPACE, which checkout creates.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # NOTE: pytest is deliberately NOT run here — tests.yml already runs
      # the full suite on every push/PR to main, and this workflow only
      # ever runs code already on main.

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          # Default create_credentials_file=true exports
          # GOOGLE_APPLICATION_CREDENTIALS, which the proxy picks up.

      - name: Download Cloud SQL Auth Proxy (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256}  cloud-sql-proxy" | sha256sum --check --strict
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --version

      - name: Start Cloud SQL Auth Proxy on 127.0.0.1:5432
        shell: bash
        run: |
          set -euo pipefail
          # Uses the instance's public IP path by default; no authorized
          # networks are needed (the proxy authenticates via IAM + mTLS).
          nohup ./cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 5432 \
            "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            > "${RUNNER_TEMP}/cloud-sql-proxy.log" 2>&1 &
          echo "PROXY_PID=$!" >> "$GITHUB_ENV"

          # Wait up to 30s for the local listener.
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "Cloud SQL Auth Proxy is listening on 127.0.0.1:5432"
              exit 0
            fi
            if ! kill -0 "$!" 2>/dev/null; then
              echo "::error::Cloud SQL Auth Proxy exited early"
              cat "${RUNNER_TEMP}/cloud-sql-proxy.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::Cloud SQL Auth Proxy did not start listening within 30s"
          cat "${RUNNER_TEMP}/cloud-sql-proxy.log"
          exit 1

      # A listening port only proves the proxy started; IAM/credential/DB
      # password problems only surface on the first real connection.
      # Fail fast here with a clear error instead of minutes later deep in
      # the pipeline.
      - name: Verify database connectivity (SELECT 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              conn.execute(text("SELECT 1"))
          print("Database connectivity OK via Cloud SQL Auth Proxy")
          PY

      # ----------------------------------------------------------------
      # Resolve REPORT_DRY_RUN / LINE_DELIVERY_MODE.
      #
      # VERIFIED AGAINST app/jobs/daily_ranking.py: these two flags are
      # checked in two SEPARATE `if` blocks, not mutually exclusive.
      # REPORT_DRY_RUN=true does NOT suppress a real broadcast on its
      # own — a genuine preview-only run must force LINE_DELIVERY_MODE=off.
      # ----------------------------------------------------------------
      - name: Resolve execution mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Scheduled production run: live broadcast."
            echo "REPORT_DRY_RUN=false" >> "$GITHUB_ENV"
            echo "LINE_DELIVERY_MODE=broadcast" >> "$GITHUB_ENV"

          elif [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "Manual dry-run: LINE delivery forced off."
            echo "REPORT_DRY_RUN=true" >> "$GITHUB_ENV"
            echo "LINE_DELIVERY_MODE=off" >> "$GITHUB_ENV"

          else
            echo "Manual live run: delivery_mode=${{ github.event.inputs.delivery_mode }}"
            echo "REPORT_DRY_RUN=false" >> "$GITHUB_ENV"
            echo "LINE_DELIVERY_MODE=${{ github.event.inputs.delivery_mode }}" >> "$GITHUB_ENV"
          fi

      # ----------------------------------------------------------------
      # Exit codes from app.jobs.daily_ranking.run():
      #   0 -> success / non-trading-day skip
      #   1 -> fatal error
      #   2 -> WAITING_FOR_DATA
      # Any non-zero exit fails this run, so the next scheduled attempt's
      # `gate` job retries.
      #
      # NOTE: EPS observation rows are written to DATABASE_URL during
      # feature-building regardless of REPORT_DRY_RUN (benign,
      # append-only, revision-safe).
      # ----------------------------------------------------------------
      - name: Run daily ranking
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # K-line chart hosting (public GCS bucket). A repository
          # VARIABLE (not a secret: the bucket name is public in every
          # image URL). Empty/unset -> hosting disabled, cards are sent
          # without a hero image. Credentials come from the WIF auth step
          # above (ADC); the SA only needs roles/storage.objectCreator.
          CHART_GCS_BUCKET: ${{ vars.CHART_GCS_BUCKET }}
          # Scheduled: the date pinned by `gate` from created_at.
          # Manual: the trading_date input (empty -> today in Taipei).
          TARGET_TRADING_DATE: ${{ github.event_name == 'schedule' && needs.gate.outputs.trading_date || github.event.inputs.trading_date }}
        run: |
          echo "event=${{ github.event_name }} target_date=${TARGET_TRADING_DATE:-today} dry_run=${REPORT_DRY_RUN} delivery_mode=${LINE_DELIVERY_MODE}"
          python -m app.jobs.daily_ranking

      - name: Show Cloud SQL Auth Proxy log
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/cloud-sql-proxy.log" ]]; then
            cat "${RUNNER_TEMP}/cloud-sql-proxy.log"
          fi

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        shell: bash
        run: |
          if [[ -n "${PROXY_PID:-}" ]]; then
            kill "${PROXY_PID}" 2>/dev/null || true
          fi