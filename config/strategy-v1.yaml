strategy_version: rule-v1.0.0

candidate:
  maximum_count: 50
  minimum_turnover: 50000000  # TWD

risk_policy:
  maximum_consecutive_limit_up_days: 3
  excessive_return_5d: 0.35
  minimum_data_completeness: 0.80
  allow_attention_stock: true
  allow_ky_stock: true
  allow_one_price_limit_up: true

  # Mirrors app.domain.risk_policy.RISK_FLAG_PENALTIES by hand for
  # now (no config loader reads this section yet) — same status as
  # candidate.minimum_turnover/maximum_count above. strategy-v1
  # provisional assumptions, must be tuned via backtesting.
  penalties:
    attention_stock: 0.15
    ky_stock: 0.10
    one_price_limit_up: 0.20
    excessive_consecutive_limit_up: 0.30
    high_five_day_return: 0.25

weights:
  liquidity: 0.25
  volume_price: 0.20
  momentum: 0.15
  institutional: 0.15
  fundamental: 0.15
  risk_quality: 0.10

# All thresholds and weights above are only strategy-v1 initial
# assumptions and must be tuned via Phase 5 performance tracking and
# out-of-sample backtesting. When tuning, create a new
# strategy_version (e.g. rule-v1.1.0) instead of overwriting this one,
# otherwise historical ranking results lose their reference baseline.